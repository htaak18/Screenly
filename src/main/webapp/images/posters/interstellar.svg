<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <radialGradient id="space" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a0010"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="wormhole" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#1a0040" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7b2fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000010" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background space -->
  <rect width="400" height="600" fill="url(#space)"/>
  <!-- Stars -->
  <g fill="white">
    <circle cx="30"  cy="40"  r="0.8" opacity="0.8"/>
    <circle cx="80"  cy="90"  r="1"   opacity="0.6"/>
    <circle cx="340" cy="30"  r="1.2" opacity="0.9"/>
    <circle cx="370" cy="120" r="0.7" opacity="0.5"/>
    <circle cx="60"  cy="180" r="0.9" opacity="0.7"/>
    <circle cx="290" cy="80"  r="0.8" opacity="0.6"/>
    <circle cx="150" cy="50"  r="1.1" opacity="0.8"/>
    <circle cx="240" cy="130" r="0.6" opacity="0.5"/>
    <circle cx="10"  cy="300" r="0.9" opacity="0.6"/>
    <circle cx="380" cy="250" r="0.7" opacity="0.7"/>
    <circle cx="120" cy="310" r="1"   opacity="0.4"/>
    <circle cx="350" cy="350" r="0.8" opacity="0.5"/>
  </g>
  <!-- Wormhole glow -->
  <ellipse cx="200" cy="220" rx="140" ry="140" fill="url(#wormhole)"/>
  <!-- Saturn-like planet ring -->
  <ellipse cx="200" cy="220" rx="100" ry="20" fill="none" stroke="#7b2fff" stroke-width="2" opacity="0.5" transform="rotate(-15,200,220)"/>
  <ellipse cx="200" cy="220" rx="85"  ry="16" fill="none" stroke="#5a1fcf" stroke-width="1" opacity="0.4" transform="rotate(-15,200,220)"/>
  <!-- Spacecraft silhouette -->
  <g transform="translate(185,190) scale(0.9)">
    <ellipse cx="15" cy="30" rx="15" ry="6" fill="#334" opacity="0.9"/>
    <rect x="10" y="15" width="10" height="20" rx="3" fill="#445" opacity="0.9"/>
    <rect x="0"  y="24" width="30" height="3" rx="1" fill="#556"/>
  </g>
  <!-- Dark bottom band -->
  <rect x="0" y="380" width="400" height="220" fill="#000010"/>
  <!-- Titles -->
  <text x="200" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#e8daf8" letter-spacing="4">INTERSTELLAR</text>
  <line x1="60" y1="453" x2="340" y2="453" stroke="#7b2fff" stroke-width="1.5"/>
  <text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9977cc" letter-spacing="3">MANKIND WAS BORN ON EARTH</text>
  <text x="200" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9977cc" letter-spacing="3">IT WAS NEVER MEANT TO DIE HERE</text>
  <text x="200" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4a3066" letter-spacing="2">Sci-Fi / Adventure  ·  169 min  ·  English</text>
  <text x="200" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2a1a44" letter-spacing="1">U/A</text>
</svg>
