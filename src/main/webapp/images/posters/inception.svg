<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a7bd5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg)"/>
  <!-- Glowing orb -->
  <ellipse cx="200" cy="220" rx="120" ry="120" fill="url(#glow)"/>
  <!-- Concentric dream rings -->
  <circle cx="200" cy="220" r="100" fill="none" stroke="#3a7bd5" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="220" r="75"  fill="none" stroke="#3a7bd5" stroke-width="1"   opacity="0.3"/>
  <circle cx="200" cy="220" r="50"  fill="none" stroke="#3a7bd5" stroke-width="0.8" opacity="0.25"/>
  <!-- Totem silhouette -->
  <rect x="190" y="175" width="20" height="40" rx="2" fill="#aac4e0" opacity="0.9"/>
  <!-- Rotating city lines -->
  <line x1="100" y1="220" x2="300" y2="220" stroke="#3a7bd5" stroke-width="0.8" opacity="0.3"/>
  <line x1="200" y1="120" x2="200" y2="320" stroke="#3a7bd5" stroke-width="0.8" opacity="0.3"/>
  <!-- Grid lines suggesting architecture -->
  <g opacity="0.15" stroke="#aac4e0" stroke-width="0.5">
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="290" x2="400" y2="290"/>
    <line x1="80"  y1="0" x2="80"  y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
  </g>
  <!-- Bottom gradient overlay -->
  <rect x="0" y="360" width="400" height="240" fill="#0d1b2a"/>
  <!-- Title area -->
  <text x="200" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="6">INCEPTION</text>
  <line x1="80" y1="448" x2="320" y2="448" stroke="#3a7bd5" stroke-width="1.5"/>
  <text x="200" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#aac4e0" letter-spacing="4">YOUR MIND IS THE SCENE OF THE CRIME</text>
  <text x="200" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5577aa" letter-spacing="2">Sci-Fi / Thriller  ·  148 min  ·  English</text>
  <text x="200" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#334466" letter-spacing="1">U/A</text>
</svg>
